<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 3문장 영어회화</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-root">
<div class="page">

  <header class="topbar">
    <div class="date-badge">
      <span class="date-badge__icon">📅</span>
      <span id="todayDate"></span>
    </div>
    <div class="topbar__row">
      <h1 class="topbar__title">오늘의 <span>영어 3문장</span></h1>
      <div class="streak-badge">
        <span class="streak-badge__icon">🔥</span>
        <span id="streakText"></span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel panel--pink" aria-label="오늘의 영어 문장">
      <div class="panel__header">
        <h2>📖 오늘의 영어 문장</h2>
      </div>
      <ul class="card-list" id="todayList"></ul>
    </section>

    <section class="panel panel--lavender" aria-label="즐겨찾기한 문장">
      <div class="panel__header">
        <h2>⭐ 즐겨찾기한 문장</h2>
        <span class="panel__badge" id="favoriteCount">0</span>
      </div>
      <ul class="card-list" id="favoriteList"></ul>
      <p class="empty-state" id="favoriteEmpty" hidden>
        <span class="empty-state__icon">☆</span>
        아직 즐겨찾기한 문장이 없어요.
      </p>
      <div class="pagination" id="favoritePagination" hidden>
        <button type="button" class="pagination__btn" data-page-action="prev" aria-label="이전 문장">‹</button>
        <span class="pagination__label" id="favoritePageLabel"></span>
        <button type="button" class="pagination__btn" data-page-action="next" aria-label="다음 문장">›</button>
      </div>
    </section>

    <section class="panel panel--peach panel--span" aria-label="복습 퀴즈">
      <div class="panel__header">
        <h2>🧠 복습 퀴즈</h2>
        <span class="panel__badge" id="quizScore">0/0</span>
      </div>
      <div id="quizArea"></div>
    </section>
  </main>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
